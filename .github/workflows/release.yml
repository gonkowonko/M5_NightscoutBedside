# Builds the firmware on every push and pull request. On a version tag
# (e.g. v1.2.0) it also publishes a GitHub release with the firmware files and
# deploys the browser flasher to GitHub Pages.
#
# To release: bump FW_VERSION in include/version.h, add a CHANGELOG.md section,
# commit, then:  git tag v1.2.0 && git push origin v1.2.0
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run -e m5stack-basic

      - name: Check the tag matches FW_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          fw="v$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' include/version.h)"
          if [ "$fw" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match FW_VERSION $fw in include/version.h"
            exit 1
          fi

      - name: Package
        run: tools/package_release.sh

      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.bin dist/M5NS.INI \
            --title "M5_NightscoutBedside $GITHUB_REF_NAME" \
            --notes-file dist/NOTES.md

      - name: Prepare Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/configure-pages@v6

      - name: Upload flasher site
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy-flasher:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
