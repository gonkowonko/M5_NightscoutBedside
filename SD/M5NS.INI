; M5NS.INI - configuration for the M5 Bedside Clock firmware.
; Same format as mlukasek/M5_NightscoutMon: the same card works with both.
; Keys this firmware doesn't use are simply ignored.

[config]
; Your Nightscout site (host name or full https:// URL) and access token.
nightscout = yoursite.example.com
token = yourtoken-0123456789abcdef

; Time zone. "tz" is a POSIX TZ string and switches summer time automatically
; (UK default shown). Without "tz", the fixed offsets time_zone + dst (seconds)
; from the original firmware are used instead.
tz = GMT0BST,M3.5.0/1,M10.5.0
time_zone = 0
dst = 0

; 0 = mmol/L, 1 = mg/dL. Thresholds below are in the same unit.
show_mgdl = 0

; 0 = 24 hour clock, 1 = 12 hour clock
time_format = 0
; 0 = "Wed 14 Oct", 1 = "Wed Oct 14"
date_format = 0

; Range colours: red below red_low / above red_high,
; amber below yellow_low / above yellow_high, otherwise green.
yellow_low = 4.5
yellow_high = 9
red_low = 3.9
red_high = 11

; Brightness levels in percent, cycled with button A.
brightness1 = 50
brightness2 = 100
brightness3 = 10

; --- Bedside clock only ---
; Data older than this many minutes is shown greyed out and struck through.
stale_minutes = 10
; Night dimming, opt-in: 1 = dim to night_brightness between these times
; (24 h, local time); any button restores normal brightness for 30 seconds.
; 0 = off, the level picked with button A stays put day and night.
night_mode = 0
night_start = 22:00
night_end = 07:00
night_brightness = 5

; Wi-Fi networks, tried in turn (up to [wlan9]).
[wlan1]
ssid = YourWiFi
pass = YourWiFiPassword

[wlan2]
ssid = OtherWiFi
pass = OtherWiFiPassword
