; M5 Bedside Nightscout Clock
; Original M5Stack Basic Core (ESP32, no PSRAM) in the BTC Standing Base.

[env:m5stack-basic]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@^0.2.2
    m5stack/M5GFX@^0.2.3
    bblanchon/ArduinoJson@^7.2.0
