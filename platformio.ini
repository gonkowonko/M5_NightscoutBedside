; M5 Bedside Nightscout Clock
; Original M5Stack Basic Core (ESP32, no PSRAM) in the BTC Standing Base.

[platformio]
default_envs = m5stack-basic

[env:m5stack-basic]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
upload_speed = 115200  ; faster speeds were unreliable over the USB-A adapter
board_build.partitions = min_spiffs.csv  ; two 1.9 MB app slots for OTA updates
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@^0.2.2
    m5stack/M5GFX@^0.2.3
    bblanchon/ArduinoJson@^7.2.0

; Wireless update: pio run -e ota -t upload
; (the first flash with the OTA partition layout has to be over USB)
[env:ota]
extends = env:m5stack-basic
upload_protocol = espota
upload_port = m5clock.local
